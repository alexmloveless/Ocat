[tool.poetry]
name = "ocat"
version = "0.2.0"
description = "A interactive LLM Chat CLI`"
authors = ["Alex Loveless <alex@alexloveless.uk>"]
license = "MIT"
readme = "README.md"
keywords = ["cli", "file-processing", "concatenation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
packages = [{ include = "ocat", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9"
rich = "^14.0.0"
prompt-toolkit = "^3.0.51"
pyyaml = "^6.0.2"
pydantic = "^2.11.7"
langchain = "^0.3.26"
langgraph = "^0.5.0"
langchain-openai = "^0.2.10"
langchain-anthropic = "^0.3.0"
langchain-google-genai = "^2.0.8"
chromadb = "^1.0.13"
duckdb = "^1.1.3"
pystache = "^0.6.8"
openai = "^1.93.0"
anthropic = "^0.55.0"
google-generativeai = "^0.8.5"
aiohttp = "^3.12.13"
pytz = "^2025.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
black = "^24.0.0"
mypy = "^1.0.0"
ruff = "*"
types-pyyaml = "^6.0.0"
pytest-asyncio = "^1.0.0"

[tool.poetry.scripts]
ocat = "ocat.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
